# Production validation
name: NEXO CI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: JavaScript syntax
        run: |
          for f in api/*.js scripts/*.mjs; do node --check "$f"; done
      - name: NEXO static checks
        run: node scripts/nexo-check.mjs
