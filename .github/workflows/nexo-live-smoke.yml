name: NEXO Live Smoke

on:
  push:
    branches: [main]
    paths:
      - 'nexo-production/**'
      - 'api/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/nexo-live-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nexo-production-production.up.railway.app"
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 12 "$BASE/anunciar/" -o /tmp/anunciar.html               && grep -q "Vista previa" /tmp/anunciar.html               && curl -fsS --max-time 12 "$BASE/api/health" -o /tmp/health.json               && grep -q '"ok":true' /tmp/health.json; then
              ok=1
              break
            fi
            sleep 6
          done
          test "$ok" = "1"

      - name: Verify public routes and UI markers
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nexo-production-production.up.railway.app"
          for path in / /anunciar/ /pago/ /solicitud-recibida/ /contacto/ /eliminacion/ /terminos/ /privacidad/ /nexo-control-9x4/ /api/health /api/public-config; do
            code="$(curl -sS -o "/tmp/$(echo "$path" | tr '/?' '__').out" -w '%{http_code}' --max-time 15 "$BASE$path")"
            test "$code" = "200"
          done

          curl -fsS "$BASE/anunciar/" -o /tmp/anunciar.html
          grep -q 'id="previewImage"' /tmp/anunciar.html
          grep -q 'id="previewName"' /tmp/anunciar.html
          grep -q 'Así se verá tu perfil dentro de NEXO.' /tmp/anunciar.html

          code="$(curl -sS -o /tmp/admin404.html -w '%{http_code}' "$BASE/admin/")"
          test "$code" = "404"
          curl -fsS "$BASE/nexo-control-9x4/" -o /tmp/admin.html
          grep -q 'id="login"' /tmp/admin.html
          grep -q '/api/admin-submissions' /tmp/admin.html
          grep -q 'Descargar foto' /tmp/admin.html
          grep -q 'PDF con foto' /tmp/admin.html
          if grep -q 'Reenviar aviso inicial' /tmp/admin.html; then exit 1; fi
          if grep -q 'You can only send testing emails' /tmp/admin.html; then exit 1; fi
          curl -fsSI "$BASE/nexo-control-9x4/" | grep -qi '^cache-control: .*no-store'
          curl -fsSI "$BASE/anunciar/" | grep -qi '^cache-control: .*no-store'
          if grep -Fq '\\n' /tmp/admin.html; then
            echo "Admin HTML still contains literal backslash-n sequences"
            exit 1
          fi

          curl -fsS "$BASE/pago/" -o /tmp/pago.html
          grep -q '/api/paypal-create-order' /tmp/pago.html
          grep -q '/api/paypal-capture-order' /tmp/pago.html
          grep -q 'disable-funding=credit,paylater' /tmp/pago.html
          grep -q 'id="paypal-direct"' /tmp/pago.html
          grep -q 'id="paypal-standard-form"' /tmp/pago.html
          grep -q 'name="custom"' /tmp/pago.html
          grep -q 'name="notify_url"' /tmp/pago.html
          grep -q '/api/paypal-ipn' /tmp/pago.html

          curl -fsS "$BASE/nexo-control-9x4/" -o /tmp/admin2.html
          grep -q '/api/admin-login' /tmp/admin2.html
          grep -q '/api/admin-logout' /tmp/admin2.html
          grep -q '/api/admin-action' /tmp/admin2.html
          grep -q '/api/admin-events' /tmp/admin2.html
          grep -q '/api/admin-delete' /tmp/admin2.html
          grep -q '/api/admin-receipt' /tmp/admin2.html
          grep -q 'acceso biométrico / Windows Hello / Face ID' /tmp/admin2.html
          grep -q 'Exportar CSV' /tmp/admin2.html
          if grep -q 'localStorage.*nexo_admin_key' /tmp/admin2.html; then
            echo "Admin should not store the admin key in localStorage"
            exit 1
          fi

          grep -q '"ok":true' /tmp/_api_health.out
          grep -q '"price":"12.00"' /tmp/_api_public-config.out
          grep -q '"paypalHostedAmount":"1.00"' /tmp/_api_public-config.out

          ipn_code="$(curl -sS -o /tmp/paypal-ipn-invalid.out -w '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/x-www-form-urlencoded' --data 'foo=bar' "$BASE/api/paypal-ipn")"
          test "$ipn_code" = "200"

          echo "NEXO live smoke checks: OK"
